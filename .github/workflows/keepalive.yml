name: Git-Pass Keep-Alive Heartbeat

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier inactivity spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Git-Pass Service
    runs-on: ubuntu-latest
    steps:
      - name: Ping Git-Pass Health Endpoint
        run: |
          echo "Sending keep-alive ping to Git-Pass..."
          curl -s -f -m 30 https://git-pass.onrender.com/health/ || echo "Git-Pass ping returned status code $?"
