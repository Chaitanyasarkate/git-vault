name: Git-Vault Keep-Alive Heartbeat

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier inactivity spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Git-Vault Services
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoints
        run: |
          echo "Pinging Git-Vault endpoints..."
          curl -s -f -m 25 https://git-vault-theta.vercel.app/ping.txt || echo "Vercel ping returned $?"
          curl -s -f -m 25 https://git-vault.onrender.com/ping.txt || echo "Render ping returned $?"
          curl -s -f -m 25 https://git-pass.onrender.com/health/ || echo "Git-Pass ping returned $?"

