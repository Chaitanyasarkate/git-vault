services:
  # ==============================================================
  # Git-Pass: A privacy-focused password manager (Django on Render)
  # Zero Server Storage: Passwords encrypted in user's GitHub repo
  # ==============================================================
  - type: web
    name: git-pass
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn gitpass_project.wsgi:application"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "git-pass.onrender.com,.onrender.com,localhost,127.0.0.1"
