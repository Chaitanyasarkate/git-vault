<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Git-Pass Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Atmospheric Diagonal Spotlight Beam -->
  <div class="popup-atmospheric-beam" aria-hidden="true"></div>

  <!-- Main Container -->
  <div class="popup-container">

    <!-- Top Universal Header -->
    <header class="popup-header">
      <div class="popup-brand">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" class="popup-emblem-svg">
          <circle cx="12" cy="12" r="9" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.8" stroke-dasharray="3.2 3.2" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="3.5" fill="#ffffff"/>
          <circle cx="12" cy="5" r="1.1" fill="#ffffff"/>
          <circle cx="12" cy="19" r="1.1" fill="#ffffff"/>
          <circle cx="5" cy="12" r="1.1" fill="#ffffff"/>
          <circle cx="19" cy="12" r="1.1" fill="#ffffff"/>
        </svg>
        <span class="popup-brand-title">Git-Pass</span>
      </div>

      <div class="popup-header-actions" id="headerActions" style="display: none;">
        <span class="popup-repo-tag" id="headerRepoTag" title="Connected Repository">repo</span>
        <button type="button" id="btnToggleBiometrics" class="popup-icon-btn" title="Toggle Biometric Unlock">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004 11m0 0a8 8 0 00.126 1.411m2.775 5.568A9.972 9.972 0 0012 21c2.14 0 4.135-.672 5.776-1.816"/></svg>
        </button>
        <button type="button" id="btnOpenWeb" class="popup-icon-btn" title="Open Full Web Dashboard">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </button>
        <button type="button" id="btnLockVault" class="popup-icon-btn" title="Lock Vault">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </button>
      </div>
    </header>

    <!-- Notification Toast -->
    <div id="toastMessage" class="popup-toast hidden"></div>

    <!-- ================= VIEW 1: UNLOCK / SETUP ================= -->
    <div id="viewUnlock" class="popup-view">
      <div class="popup-center-hero">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" class="popup-emblem-svg">
          <circle cx="12" cy="12" r="9" stroke="rgba(255, 255, 255, 0.85)" stroke-width="1.8" stroke-dasharray="3.2 3.2" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="3.5" fill="#ffffff"/>
          <circle cx="12" cy="5" r="1.2" fill="#ffffff"/>
          <circle cx="12" cy="19" r="1.2" fill="#ffffff"/>
          <circle cx="5" cy="12" r="1.2" fill="#ffffff"/>
          <circle cx="19" cy="12" r="1.2" fill="#ffffff"/>
        </svg>
        <h2 class="popup-view-title" id="unlockTitle">Unlock Vault</h2>
        <p class="popup-view-subtitle" id="unlockSubtitle">Enter master password to decrypt repository data.</p>
      </div>

      <form id="formUnlock" class="popup-form">
        <!-- Setup fields (Hidden when already configured) -->
        <div id="setupFields" class="popup-field-group">
          <input type="text" id="setupUsername" placeholder="GitHub username (e.g. ChaitanyaSarkate)" class="popup-pill-input">
          <input type="text" id="setupRepo" placeholder="Repository name (e.g. git-vault)" class="popup-pill-input mt-2">
          <div class="input-with-action mt-2">
            <input type="password" id="setupToken" placeholder="GitHub PAT (ghp_...)" class="popup-pill-input">
            <button type="button" class="eye-toggle-btn" data-target="setupToken">👁</button>
          </div>
        </div>

        <!-- Master Password (Always Required to Decrypt) -->
        <div class="input-with-action mt-2">
          <input type="password" id="unlockMasterPassword" placeholder="Master encryption password" required class="popup-pill-input">
          <button type="button" class="eye-toggle-btn" data-target="unlockMasterPassword">👁</button>
        </div>

        <button type="submit" id="btnSubmitUnlock" class="btn-stark-white mt-3">
          <span>Unlock & Load Vault</span>
        </button>

        <!-- Biometric Unlock Button (WebAuthn Touch ID / Windows Hello) -->
        <button type="button" id="btnBiometricUnlock" class="btn-dark-pill mt-2 hidden" style="border-color: rgba(56, 189, 248, 0.4); color: #38bdf8;">
          <svg width="15" height="15" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004 11m0 0a8 8 0 00.126 1.411m2.775 5.568A9.972 9.972 0 0012 21c2.14 0 4.135-.672 5.776-1.816"/></svg>
          <span>Unlock with Biometrics</span>
        </button>

        <button type="button" id="btnQuickDemo" class="btn-dark-pill mt-2">
          <span>⚡ Quick Instant Demo</span>
        </button>

        <div class="popup-footer-row">
          <button type="button" id="btnToggleSettings" class="text-link-subtle">
            Change GitHub Repo Settings
          </button>
        </div>
      </form>
    </div>

    <!-- ================= VIEW 2: VAULT LIST ================= -->
    <div id="viewVault" class="popup-view hidden">
      
      <!-- Current Active Tab Quick Bar -->
      <div id="currentTabBox" class="current-tab-pill hidden">
        <div class="tab-domain-text">
          <span class="text-dim">Current Tab:</span>
          <span id="currentDomainLabel" class="font-bold text-white truncate">domain.com</span>
        </div>
        <button type="button" id="btnQuickAddCurrent" class="btn-sm-white">
          + Save Site
        </button>
      </div>

      <!-- Search Bar -->
      <div class="popup-search-box">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" class="search-icon"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" id="vaultSearch" placeholder="Filter passwords or accounts..." class="popup-pill-input search-input">
      </div>

      <!-- Action Buttons Row -->
      <div class="vault-tools-row">
        <button type="button" id="btnShowAddView" class="btn-stark-white flex-1">
          + Add Password
        </button>
        <button type="button" id="btnShowGenView" class="btn-dark-pill">
          ⚡ Generator
        </button>
      </div>

      <!-- Vault Items List -->
      <div id="vaultList" class="vault-items-scroll">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- ================= VIEW 3: ADD PASSWORD ================= -->
    <div id="viewAdd" class="popup-view hidden">
      <div class="view-header-row">
        <button type="button" class="btn-back-link" id="btnBackFromAdd">
          &larr; Back
        </button>
        <h3 class="view-subtitle-heading">Add New Credential</h3>
      </div>

      <form id="formAddCredential" class="popup-form">
        <div class="form-group">
          <input type="text" id="addTitle" placeholder="Service / Title (e.g. GitHub)" required class="popup-pill-input">
        </div>
        <div class="form-group mt-2">
          <input type="text" id="addUsername" placeholder="Username / Email" required class="popup-pill-input">
        </div>
        <div class="form-group mt-2">
          <div class="input-with-action">
            <input type="password" id="addPassword" placeholder="Password" required class="popup-pill-input">
            <button type="button" class="eye-toggle-btn" data-target="addPassword">👁</button>
            <button type="button" id="btnQuickGenInAdd" class="btn-inline-gen" title="Generate Strong Password">⚡</button>
          </div>
        </div>
        <div class="form-group mt-2">
          <input type="text" id="addUrl" placeholder="Website URL (e.g. https://...)" class="popup-pill-input">
        </div>
        <div class="form-group mt-2">
          <input type="text" id="addTotp" placeholder="2FA / TOTP Secret (Base32 or otpauth://)" class="popup-pill-input">
        </div>
        <div class="form-group mt-2">
          <input type="text" id="addNotes" placeholder="Notes (optional)" class="popup-pill-input">
        </div>

        <button type="submit" id="btnSaveCredential" class="btn-stark-white mt-3">
          <span>Encrypt & Commit to GitHub</span>
        </button>
      </form>
    </div>

    <!-- ================= VIEW 4: GENERATOR ================= -->
    <div id="viewGenerator" class="popup-view hidden">
      <div class="view-header-row">
        <button type="button" class="btn-back-link" id="btnBackFromGen">
          &larr; Back
        </button>
        <h3 class="view-subtitle-heading">Password Generator</h3>
      </div>

      <div class="gen-display-box">
        <span id="genResultText" class="gen-password-text">Generating...</span>
        <button type="button" id="btnCopyGenPassword" class="btn-copy-sm" title="Copy to Clipboard">
          Copy
        </button>
      </div>

      <div class="gen-controls-box">
        <div class="gen-slider-row">
          <span>Length: <strong id="genLengthVal">20</strong></span>
          <input type="range" id="genLength" min="10" max="40" value="20" class="slider-accent">
        </div>

        <div class="gen-check-grid">
          <label class="check-label"><input type="checkbox" id="genUpper" checked> A-Z Uppercase</label>
          <label class="check-label"><input type="checkbox" id="genLower" checked> a-z Lowercase</label>
          <label class="check-label"><input type="checkbox" id="genNumbers" checked> 0-9 Numbers</label>
          <label class="check-label"><input type="checkbox" id="genSymbols" checked> !@#$ Symbols</label>
        </div>

        <button type="button" id="btnRegenerate" class="btn-dark-pill mt-3">
          🔄 Generate New
        </button>
      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="crypto.js"></script>
  <script src="github.js"></script>
  <script src="popup.js"></script>
</body>
</html>
